# fly.toml app configuration file generated for finterminal on 2026-11-17T22:57:58-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'finterminal'
primary_region = 'ord'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/api/status'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'finterminal_data'
  destination = '/data'
